services:
  db:
    image: postgres:17
    container_name: fake-payment-gateway-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fake_payment_gateway
    ports:
      - "5436:5432"
    volumes:
      - fake_payment_gateway_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fake_payment_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: fake-payment-gateway
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fake_payment_gateway
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8090
      PAYMENT_TIMEOUT_MS: 5000
    ports:
      - "8090:8090"

volumes:
  fake_payment_gateway_data:
