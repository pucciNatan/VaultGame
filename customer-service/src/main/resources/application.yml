spring:
  application:
    name: customer-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/customer_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8091}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

vaultgame:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-at-least-32-chars}
    issuer: ${JWT_ISSUER:vaultgame-identity}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
