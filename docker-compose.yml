services:
  db:
    image: postgres:17
    container_name: vaultgamedb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vaultgamedb
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  dbnosql:
    image: mongo:8
    container_name: vaultgamedbnosql
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
      MONGO_INITDB_DATABASE: vaultgamedbnosql
    ports:
      - "27015:27017"
    volumes:
      - mongo_data:/data/db

  dbpayments:
    image: postgres:17
    container_name: fake-payment-gateway-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fake_payment_gateway
    ports:
      - "5436:5432"
    volumes:
      - fake_payment_gateway_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fake_payment_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  paymentgateway:
    build: ./fake-payment-gateway
    container_name: fake-payment-gateway
    depends_on:
      dbpayments:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://dbpayments:5432/fake_payment_gateway
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8090
      PAYMENT_TIMEOUT_MS: 5000
    ports:
      - "8090:8090"

  dbcustomer:
    image: postgres:17
    container_name: customer-service-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customer_db
    ports:
      - "5437:5432"
    volumes:
      - customer_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customer_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  customer:
    build: ./customer-service
    container_name: customer-service
    depends_on:
      dbcustomer:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://dbcustomer:5432/customer_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8091
      JWT_SECRET: change-me-in-production-use-at-least-32-chars
      JWT_ISSUER: vaultgame-identity
      JWT_EXPIRATION_SECONDS: 3600
    ports:
      - "8091:8091"
  mailpit:
    image: axllent/mailpit:latest
    container_name: vaultgame-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  email:
    build: ./email-service
    container_name: email-service
    depends_on:
      - mailpit
    environment:
      SERVER_PORT: 8092
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      MAIL_FROM: noreply@vaultgame.local
    ports:
      - "8092:8092"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    container_name: vaultgame-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: vaultgame-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  tempo:
    image: grafana/tempo:2.7.2
    container_name: vaultgame-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3240:3200"

  grafana:
    image: grafana/grafana:11.6.3
    container_name: vaultgame-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3800:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  postgres_data:
  mongo_data:
  prometheus_data:
  tempo_data:
  grafana_data:
  fake_payment_gateway_data:
  customer_db_data:
